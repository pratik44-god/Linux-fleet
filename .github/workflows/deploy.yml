
name: LinuxFleet CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: linuxfleetacr
  RESOURCE_GROUP: linuxfleet-rg
  BACKEND_APP: linuxfleet-api
  FRONTEND_APP: linuxfleet-web

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Authenticate with Azure using OIDC
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # 3. Install Azure Container Apps extension
      - name: Install Azure Container Apps extension
        run: |
          az extension add --name containerapp --upgrade

      # 4. Verify Azure resources
      - name: Verify Azure resources
        run: |
          echo "=== Azure Account ==="
          az account show \
            --query "{name:name, subscriptionId:id}" \
            -o table

          echo "=== Azure Container Registry ==="
          az acr show \
            --name "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{name:name, loginServer:loginServer}" \
            -o table

          echo "=== Backend Container App ==="
          az containerapp show \
            --name "$BACKEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "name" \
            -o tsv

          echo "=== Frontend Container App ==="
          az containerapp show \
            --name "$FRONTEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "name" \
            -o tsv

      # 5. Login to Azure Container Registry
      - name: Login to Azure Container Registry
        run: |
          az acr login --name "$ACR_NAME"

          ACR_LOGIN_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query loginServer \
            -o tsv)

          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"

          echo "Using registry: $ACR_LOGIN_SERVER"

      # 6. Build and push backend image
      - name: Build and push backend image
        run: |
          echo "Building backend image..."

          docker build \
            -f Dockerfile.backend \
            -t "$ACR_LOGIN_SERVER/linuxfleet-api:${GITHUB_SHA}" \
            -t "$ACR_LOGIN_SERVER/linuxfleet-api:latest" \
            .

          echo "Pushing backend images..."

          docker push "$ACR_LOGIN_SERVER/linuxfleet-api:${GITHUB_SHA}"
          docker push "$ACR_LOGIN_SERVER/linuxfleet-api:latest"

      # 7. Validate and normalize frontend configuration
      - name: Validate frontend configuration
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GRAFANA_URL: ${{ vars.NEXT_PUBLIC_GRAFANA_URL }}
        run: |
          set -euo pipefail

          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "ERROR: NEXT_PUBLIC_API_URL is not configured."
            exit 1
          fi

          if [ -z "$NEXT_PUBLIC_GRAFANA_URL" ]; then
            echo "ERROR: NEXT_PUBLIC_GRAFANA_URL is not configured."
            exit 1
          fi

          # Remove leading and trailing whitespace
          NEXT_PUBLIC_API_URL="$(printf '%s' "$NEXT_PUBLIC_API_URL" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          NEXT_PUBLIC_GRAFANA_URL="$(printf '%s' "$NEXT_PUBLIC_GRAFANA_URL" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"

          EXPECTED_API_URL="https://api.its-pratik.dev/trpc"
          EXPECTED_GRAFANA_URL="https://grafana.its-pratik.dev"

          if [ "$NEXT_PUBLIC_API_URL" != "$EXPECTED_API_URL" ]; then
            echo "ERROR: NEXT_PUBLIC_API_URL does not match the expected production URL."
            exit 1
          fi

          if [ "$NEXT_PUBLIC_GRAFANA_URL" != "$EXPECTED_GRAFANA_URL" ]; then
            echo "ERROR: NEXT_PUBLIC_GRAFANA_URL does not match the expected Grafana URL."
            exit 1
          fi

          echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_GRAFANA_URL=$NEXT_PUBLIC_GRAFANA_URL" >> "$GITHUB_ENV"

          echo "Frontend API and Grafana URLs validated successfully."

      # 8. Build and push frontend image
      - name: Build and push frontend image
        run: |
          set -euo pipefail

          echo "Building frontend image..."
          echo "Using API URL: $NEXT_PUBLIC_API_URL"
          echo "Using Grafana URL: $NEXT_PUBLIC_GRAFANA_URL"

          docker build \
            -f Dockerfile.frontend \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --build-arg NEXT_PUBLIC_GRAFANA_URL="$NEXT_PUBLIC_GRAFANA_URL" \
            -t "$ACR_LOGIN_SERVER/linuxfleet-frontend:${GITHUB_SHA}" \
            -t "$ACR_LOGIN_SERVER/linuxfleet-frontend:latest" \
            .

          echo "Pushing frontend images..."

          docker push "$ACR_LOGIN_SERVER/linuxfleet-frontend:${GITHUB_SHA}"
          docker push "$ACR_LOGIN_SERVER/linuxfleet-frontend:latest"

      # 9. Deploy backend to Azure Container Apps
      - name: Deploy backend
        run: |
          set -euo pipefail

          echo "Deploying backend..."

          az containerapp update \
            --name "$BACKEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/linuxfleet-api:${GITHUB_SHA}"

      # 10. Deploy frontend to Azure Container Apps
      - name: Deploy frontend
        run: |
          set -euo pipefail

          echo "Deploying frontend..."

          az containerapp update \
            --name "$FRONTEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/linuxfleet-frontend:${GITHUB_SHA}"

      # 11. Verify deployment
      - name: Verify deployment
        run: |
          set -euo pipefail

          echo "=== Backend deployment ==="

          az containerapp show \
            --name "$BACKEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{revision:properties.latestRevisionName, provisioningState:properties.provisioningState}" \
            -o table

          echo "=== Frontend deployment ==="

          az containerapp show \
            --name "$FRONTEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{revision:properties.latestRevisionName, provisioningState:properties.provisioningState}" \
            -o table

          echo "LinuxFleet CI/CD workflow completed successfully."
